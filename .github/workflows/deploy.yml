name: Trigger Cloudflare Deploy

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Deployment Hook
        run: |
          curl -X POST "$CLOUDFLARE_DEPLOY_HOOK_URL"
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
